<!DOCTYPE html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Baratov Damir — Full-stack developer</title>
    <meta name="title" content="Baratov Damir — Full-stack developer" />
    <meta
      name="description"
      content="Full-stack developer specializing in React, TypeScript, and modern web technologies. Building fast, accessible, and visually refined web applications."
    />
    <meta name="keywords" content="full-stack developer, react, typescript, web development, portfolio, javascript, tailwind css, framer motion" />
    <meta name="author" content="Baratov Damir" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wegashix.dev/" />
    <meta property="og:title" content="Baratov Damir — Full-stack developer" />
    <meta property="og:description" content="Full-stack developer specializing in React, TypeScript, and modern web technologies. Building fast, accessible, and visually refined web applications." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Baratov Damir" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://wegashix.dev/" />
    <meta name="twitter:title" content="Baratov Damir — Full-stack developer" />
    <meta name="twitter:description" content="Full-stack developer specializing in React, TypeScript, and modern web technologies." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#2563EB" />
    <meta name="color-scheme" content="light dark" />

    <!-- Fonts — preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Theme + lang init — prevents flash -->
    <script>
      (function () {
        var d = document.documentElement;
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) d.classList.add('dark');
        var lang = localStorage.getItem('lang');
        if (!lang) lang = navigator.language.toLowerCase().startsWith('ru') ? 'ru' : 'en';
        d.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
